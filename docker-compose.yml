  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vaultdrop
      POSTGRES_USER: vaultdrop
      POSTGRES_PASSWORD: vaultdrop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultdrop"]
      interval: 10s
      timeout: 5s
      retries: 5

